[project]
name = "financial-agent-reliability"
version = "0.1.7"
description = "Financial Agent Reliability Lab - Phase 1V Verified Audit Candidate"
readme = "README.md"
requires-python = ">=3.11"
[project.scripts]
agent-eval = "financial_agent.enterprise.cli:main"
agent-registry = "financial_agent.registry.bootstrap:bootstrap_all"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "streamlit>=1.35",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "dspy>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
